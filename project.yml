name: DesktopCommander
options:
  bundleIdPrefix: com.fabrizioballiano
  # An Icon Composer document is a folder. Without this XcodeGen adds the files
  # inside it one by one, and the icon never reaches actool.
  fileTypes:
    icon:
      file: true
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  developmentLanguage: en
  groupSortPosition: top
  generateEmptyDirectories: false

packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 3.0.0

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    # Universal binary: Apple silicon and Intel.
    ARCHS: $(ARCHS_STANDARD)
    VALID_ARCHS: arm64 x86_64
    # The release workflow writes this line after each release.
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ALWAYS_SEARCH_USER_PATHS: NO
    CLANG_ENABLE_OBJC_ARC: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GCC_WARN_ABOUT_RETURN_TYPE: YES_ERROR
    DEAD_CODE_STRIPPING: YES
  configs:
    Debug:
      ONLY_ACTIVE_ARCH: YES
    Release:
      ONLY_ACTIVE_ARCH: NO

targets:
  DesktopCommander:
    type: application
    platform: macOS
    sources:
      - path: Sources/DesktopCommander
      - path: Resources
        buildPhase: resources
    dependencies:
      - package: KeyboardShortcuts
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: desktop-commander
        CFBundleName: desktop-commander
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleIconName: AppIcon
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSUIElement: true
        NSAppleScriptEnabled: true
        OSAScriptingDefinition: desktop-commander.sdef
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
        NSHumanReadableCopyright: >-
          Copyright © 2026 Fabrizio Balliano. MIT licensed.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fabrizioballiano.desktop-commander
        PRODUCT_NAME: desktop-commander
        PRODUCT_MODULE_NAME: DesktopCommander
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"

  DesktopCommanderTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/DesktopCommanderTests
    dependencies:
      - target: DesktopCommander
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fabrizioballiano.desktop-commander-tests
        PRODUCT_MODULE_NAME: DesktopCommanderTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/desktop-commander.app/Contents/MacOS/desktop-commander"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  DesktopCommander:
    build:
      targets:
        DesktopCommander: all
        DesktopCommanderTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DesktopCommanderTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
